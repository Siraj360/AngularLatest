<div class="card h-100 shadow border-0 rounded overflow-hidden">
  <div class="row g-0 h-100 ">

    <!-- Profile Picture -->
    <div class="col-md-4  d-flex align-items-center justify-content-center bg-light p-3">
      <img [ngSrc]="customer().picture || 'https://via.placeholder.com/150'"
        class="img-fluid rounded-circle border border-secondary shadow" [alt]="customer().first + ' ' + customer().last"
        width="128" height="128">
    </div>

    <!-- Card Body -->
    <div class="col-md-8">
      <div class="card-body">
        <!-- Name & Title -->
        <h5 class="card-title mb-1">
          {{ customer().title }}. {{ customer().first }} {{ customer().last }}
        </h5>
        <p class="text-muted mb-2">
          <i class="fas fa-envelope me-2"></i>{{ customer().email }}
        </p>

        <!-- Address -->
        <p class="mb-1">
          <i class="fas fa-map-marker-alt me-2 text-danger"></i>
          {{ customer().address1 }}, {{ customer().address2 }}
        </p>

        <!-- Phone -->
        <p class="mb-2">
          <i class="fas fa-phone me-2 text-success"></i>{{ customer().phone }}
        </p>

        <!-- Badges for Gender & Age 
        <div class="d-flex gap-2 flex-wrap">
          -->

        <!-- Badges for Gender & Age -->
        <div class="d-flex gap-2">
          <span class="badge bg-primary">
            <i class="fas fa-user me-1"></i>{{ customer().gender | titlecase }}
          </span>
          <span class="badge bg-info text-dark">
            <i class="fas fa-birthday-cake me-1"></i>{{ customer().age }} yrs
          </span>
          <span class="badge bg-secondary">
            <i class="fas fa-calendar-alt me-1"></i>Member since {{ customer().since | date:'yyyy' }}
          </span>
        </div>



      </div>
    </div>
  </div>
</div>
