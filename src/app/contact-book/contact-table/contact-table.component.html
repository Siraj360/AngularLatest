<div class="border border-1 border-secondary-subtle">
  <div class="table-responsive border border-light p-0 m-0">
    <table class="table table-striped table-hover align-middle">
      <thead class="table-secondary text-white">
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Address</th>
          <th class="text-center">Actions</th>
        </tr>
      </thead>
      <tbody>
        @for (user of reversedUsers(); track user.id) {
          <tr>
            <td>{{ user.name }}</td>
            <td>{{ getDefaultEmail(user) }}</td>
            <td>{{ getDefaultPhone(user) }}</td>
            <td>{{ getDefaultAddress(user) }}</td>
            <td class="text-end">
              <button class="btn btn-sm btn-outline-primary me-2" (click)="editUser(user)">
                <i class="fa-solid fa-pencil me-1"></i> Edit
              </button>
              <button class="btn btn-sm btn-outline-danger" (click)="deleteUser(user.id)">
                <i class="fa-solid fa-trash me-1"></i> Delete
              </button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
   </div>
