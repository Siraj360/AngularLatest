<div class="container">

  <!-- List Header: only show when form is hidden -->
  <div *ngIf="!showContactForm" class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0">
      <i class="fa-solid fa-users me-2"></i>Contacts <span class="badge text-bg-secondary">Reactive Form</span> 
    </h2>

    <div class="d-flex align-items-center">
      <!-- Add New Contact -->
      <button class="btn btn-primary me-3" (click)="addNewContact()">
        <i class="fa-solid fa-plus me-1"></i> Add New Contact
      </button>

      <!-- Toggle Buttons -->
      <div class="btn-group" role="group" aria-label="View Mode">
        <!-- Card View Button -->
        <button
          type="button"
          class="btn"
          [ngClass]="!isListTable ? 'btn-secondary' : 'btn-outline-secondary'"
          (click)="isListTable = false"
        >
          <i class="fa-solid fa-grip"></i>
        </button>

        <!-- Table View Button -->
        <button
          type="button"
          class="btn"
          [ngClass]="isListTable ? 'btn-secondary' : 'btn-outline-secondary'"
          (click)="isListTable = true"
        >
          <i class="fa-solid fa-table-list"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Contact Form -->
  <sg-contact-form
    *ngIf="showContactForm"
    [editId]="editId"
    (updateDone)="onUpdateDone()"
  ></sg-contact-form>

  <!-- Contact List / Card -->
  <div *ngIf="!showContactForm">
    <sg-contact-table
      *ngIf="isListTable"
      (edit)="editContact($event)"
    ></sg-contact-table>

    <sg-contact-card
      *ngIf="!isListTable"
      (edit)="editContact($event)"
    ></sg-contact-card>
  </div>

</div>
