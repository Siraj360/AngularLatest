  <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4">
    @for (user of reversedUsers(); track user.id) {
      <div class="col">
        <div class="card h-100 shadow-sm">
          <div class="card-body d-flex flex-column">
            <div class="d-flex justify-content-between align-items-start mb-3">
              <h5 class="card-title mb-0">{{ user.name }}</h5>
              <div class="d-flex gap-2">
                 <button class="btn btn-sm btn-outline-primary" (click)="editUser(user)">
                   <i class="fa-solid fa-pencil"></i>
                 </button>
                 <button class="btn btn-sm btn-outline-danger" (click)="deleteUser(user.id)">
                   <i class="fa-solid fa-trash"></i>
                 </button>
              </div>
            </div>

            <div class="mb-3">
                <p class="card-text text-muted mb-1 d-flex align-items-center">
                    <i class="fa-solid fa-envelope me-2 text-primary"></i>
                    <span>{{ getDefaultEmail(user) }}</span>
                </p>
                <p class="card-text text-muted mb-1 d-flex align-items-center">
                    <i class="fa-solid fa-phone me-2 text-primary"></i>
                    <span>{{ getDefaultPhone(user) }}</span>
                </p>
                <p class="card-text text-muted mb-0 d-flex align-items-center">
                    <i class="fa-solid fa-location-dot me-2 text-primary"></i>
                    <span>{{ getDefaultAddress(user) }}</span>
                </p>
            </div>

          </div>
        </div>
      </div>
    }
  </div>
